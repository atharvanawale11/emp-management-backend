spring.application.name=employee-management-system
# Server
server.port=8080

# MySQL Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/emp_management?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Logging (optional, helpful while developing)
logging.level.org.springframework.security=DEBUG

# JWT
jwt.secret=8f4c2a9e7b1d6f3c5a8e0b2d9c7f1a4e6b3d8c5f0a9e2b7c4d6f1a8e3c9b5d3
jwt.expiration=86400000